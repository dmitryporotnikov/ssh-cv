services:
  ssh-cv:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "2222:2222"
    environment:
      SSH_CV_CONFIG_PATH: /runtime/config.yaml
      SSH_CV_INFO_PATH: /runtime/info.md
      SSH_CV_HOST_KEY_PATH: /data/ssh_host_key
    volumes:
      - ./runtime:/runtime:ro
      - ssh-cv-data:/data
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    pids_limit: 64
    ulimits:
      nofile:
        soft: 1024
        hard: 1024
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "5"

volumes:
  ssh-cv-data:
